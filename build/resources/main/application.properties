spring.application.name=sunrise
server.port=8080
# The plain HTML/CSS/JavaScript client is served directly from the front-end folder.
spring.web.resources.static-locations=file:./front-end/

# File-based H2 keeps seeded/demo data after an application restart.
spring.datasource.url=jdbc:h2:file:./data/sunrise;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Bearer token lifetime used by the built-in H2-backed authentication service.
app.security.token-hours=8
